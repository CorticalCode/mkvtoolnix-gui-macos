name: Build MKVToolNix macOS
run-name: ${{ inputs.note || github.workflow }}

on:
  schedule:
    # Check for new upstream releases weekly on Mondays at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag (blank = newest on Codeberg)'
        required: false
        default: ''
      force:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false
      note:
        description: 'Note shown as the run title, on its summary page and in any failure issue (blank = no note)'
        required: false
        default: ''

permissions:
  contents: write
  issues: write
  id-token: write       # required for attest-build-provenance
  attestations: write   # required for attest-build-provenance

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      should_build: ${{ steps.resolve.outputs.should_build }}
    steps:
      - name: Resolve tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
          TAG_INPUT: ${{ github.event.inputs.tag }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          # Written here so the note heads the run's summary page: this job finishes first.
          if [[ -n "${NOTE}" ]]; then
            echo "**Note:** ${NOTE}" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Empty on every scheduled run, and on a manual run unless a tag was
          # typed, so both triggers reach the same discovery and no release
          # number has to live in this file.
          TAG="${TAG_INPUT}"
          if [[ -z "${TAG}" ]]; then
            # Latest upstream release tag (--refs filters ^{} peeled refs).
            # git's output is kept and its status checked before anything
            # parses it: piped straight into head, a git that cannot reach
            # Codeberg reads the same as a Codeberg with no release tags.
            # Three tries, each capped at 60 s: an unanswered connection
            # otherwise waits out the kernel's two-minute timeout, and a
            # short outage should not fail the weekly check.
            ERR="${RUNNER_TEMP}/ls-remote.err"
            for ATTEMPT in 1 2 3; do
              if REFS=$(timeout 60 git ls-remote --tags --refs --sort=-v:refname \
                  https://codeberg.org/mbunkus/mkvtoolnix.git \
                  'refs/tags/release-*' 2>"${ERR}"); then
                break
              else
                STATUS=$?
              fi
              if (( STATUS == 124 )); then
                WHY="no answer within 60 s"
              else
                WHY=$(tail -n 1 "${ERR}")
              fi
              if (( ATTEMPT == 3 )); then
                echo "::error::git ls-remote failed 3 times; the last exited ${STATUS}: ${WHY}"
                exit 1
              fi
              echo "Attempt ${ATTEMPT}: git ls-remote exited ${STATUS}: ${WHY}; retrying in 15 s."
              sleep 15
            done
            TAG=$(head -n 1 <<<"${REFS}" | sed 's|.*refs/tags/||')
            if [[ -z "${TAG}" ]]; then
              echo "::error::Codeberg lists no release-* tags."
              exit 1
            fi
          fi
          # Typed or discovered, the tag must be release-<number>(.<number>)* on a single line.
          if [[ ! "${TAG}" =~ ^release-[0-9]+(\.[0-9]+)*$ ]]; then
            printf '::error::Refusing tag %q: expected release-<number>(.<number>)*\n' "${TAG}"
            exit 1
          fi
          VERSION=${TAG#release-}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${TAG} (version ${VERSION})"

          # Check if we already have any release for this version. gh's
          # output is kept and its status checked before grep reads it:
          # piped straight into grep, a gh that fails reads as "no release
          # yet" and starts a build.
          FORCE="${FORCE_INPUT}"
          LIST_ERR="${RUNNER_TEMP}/release-list.err"
          if [[ "${FORCE}" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested."
          elif ! RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 50 2>"${LIST_ERR}"); then
            echo "::error::gh release list failed, so whether v${VERSION} is released is unknown: $(tail -n 1 "${LIST_ERR}")"
            exit 1
          elif grep -q "v${VERSION}" <<<"${RELEASES}"; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release for v${VERSION} already exists, skipping."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New version ${VERSION} detected, will build."
          fi

  build:
    needs: check-release
    if: needs.check-release.outputs.should_build == 'true'
    runs-on: macos-15
    env:
      TAG: ${{ needs.check-release.outputs.tag }}
      VERSION: ${{ needs.check-release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The build root lives outside $HOME so that no account name is baked
      # into the artifacts. /opt is root-owned on the runners, so it takes one
      # privileged step to create before anything else touches it.
      - name: Create the build root
        run: |
          sudo mkdir -p /opt/mtx
          sudo chown "$(id -un)" /opt/mtx
          test -w /opt/mtx

      # Layer 1: GitHub Actions cache (ephemeral, 7-day TTL) of the downloaded
      # source tarballs. They sit outside the prefix, which every build cleans
      # before it starts, so they survive to be used; packages in the prefix
      # would not, which is why the dependencies come from layer 2 every run.
      - name: Restore source tarball cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /opt/mtx/src
          key: src-${{ needs.check-release.outputs.version }}
          restore-keys: |
            src-

      # Layer 2: Git LFS proven cache
      # .lfsconfig excludes proven/ from auto-download, so we pull explicitly
      - name: Restore deps from LFS proven cache
        run: |
          # --restore-cache checks, before downloading anything, that every
          # package has its .sha256 and a .manifest.json the build accepts
          # (schema and prefix), then pulls the LFS objects, copies each package
          # with its sidecars, and returns the working copy to pointers. Reusing
          # it keeps this in step with the script rather than duplicating the
          # layout here.
          #
          # Not fatal: a cache that is refused or cannot be pulled leaves the
          # local cache absent, and the build then compiles the dependencies
          # from source.
          ./build-local.sh --restore-cache \
            || echo "Proven cache unavailable; dependencies will be built from source."

      - name: Build MKVToolNix
        run: ./build-local.sh "${TAG}"
        timeout-minutes: 180

      # A failed build's files go with the runner. Print the runner's toolchain,
      # saved for the failure issue too, and the end of mkvtoolnix's config.log,
      # the only record of why one of configure's checks failed.
      - name: Show the runner's toolchain and the end of config.log
        if: failure()
        run: |
          {
            echo "macOS $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m)"
            echo "Xcode: $(xcodebuild -version | paste -sd ' ' -), at $(xcode-select -p)"
            echo "SDK: $(xcrun --show-sdk-version), at $(xcrun --show-sdk-path)"
            echo "clang: $(clang --version | head -n 1)"
            echo "CPUs: $(sysctl -n hw.ncpu), memory: $(sysctl -n hw.memsize | awk '{ printf "%.0f GB", $1 / 1073741824 }')"
            echo "Disk: $(df -h /opt/mtx | awk 'NR == 2 { print $4 " free of " $2 }') under /opt/mtx"
          } | tee "${RUNNER_TEMP}/toolchain.txt"
          echo
          LOG="/opt/mtx/build/mkvtoolnix-${VERSION}/config.log"
          if [[ ! -f "${LOG}" ]]; then
            echo "No ${LOG}: the build stopped before mkvtoolnix's configure ran."
            exit 0
          fi
          if [[ "$(tail -n 1 "${LOG}")" == "configure: exit 0" ]]; then
            echo "mkvtoolnix's configure succeeded, so ${LOG} has nothing on this failure."
            exit 0
          fi
          # The test log ends where autoconf's dump of its cache variables
          # begins; the "## --- ##" rules that frame its headings are dropped.
          echo "The end of what configure tested, from ${LOG}:"
          awk '/^## Cache variables\. ##$/ { exit } !/^## -+ ##$/' "${LOG}" | tail -n 100

      # Why qmake gets no output from the commands it runs on the runner (run
      # 40051649180: its "$$system(echo ok)" came back empty while xcrun worked):
      # popen from a program built on the runner, as a control, then qmake
      # running "echo ok" untraced and under dtruss, which works here because
      # System Integrity Protection is off. qmake runs as this user throughout.
      - name: Probe qmake's command running
        if: failure()
        run: |
          Q=/opt/mtx/prefix/bin/qmake6
          if [[ ! -x "${Q}" ]]; then
            echo "No ${Q}: the build stopped before Qt was restored."
            exit 0
          fi
          P="${RUNNER_TEMP}/qmake-probe"
          mkdir -p "${P}/features"
          cat > "${P}/popen.c" <<'EOF'
          #include <stdio.h>
          int main(void) {
            FILE *p = popen("cd /tmp && echo ok", "r");
            if (!p) { perror("popen"); return 1; }
            char b[64];
            size_t n = fread(b, 1, sizeof b - 1, p);
            b[n] = 0;
            for (size_t i = 0; i < n; i++) if (b[i] == '\n') b[i] = ' ';
            printf("[%s] pclose=%d\n", b, pclose(p));
            return 0;
          }
          EOF
          if clang -o "${P}/popen" "${P}/popen.c"; then
            echo "popen from a program built on the runner: $("${P}/popen" 2>&1)"
          fi
          echo 'message("echo run by qmake: [$$system(echo ok)]")' > "${P}/features/default_pre.prf"
          : > "${P}/features/default_post.prf"
          for r in untraced traced; do mkdir -p "${P}/run-${r}" && : > "${P}/run-${r}/probe.pro"; done
          echo "--- qmake, untraced:"
          ( cd "${P}/run-untraced" && QMAKEFEATURES="${P}/features" "${Q}" -makefile -nocache probe.pro 2>&1 ) \
            || echo "(qmake exited $?)"
          echo "--- qmake under dtruss -f, every system call of qmake and its children:"
          ( cd "${P}/run-traced" && sudo dtruss -f sudo -u "$(id -un)" env QMAKEFEATURES="${P}/features" "${Q}" -makefile -nocache probe.pro ) \
            > "${P}/trace.txt" 2>&1 || echo "(dtruss exited $?)"
          echo "$(wc -l < "${P}/trace.txt" | tr -d ' ') lines"
          cat "${P}/trace.txt"

      - name: Stage the release DMG
        run: |
          # build-local.sh writes release/MKVToolNix-<ver>-macos-<arch>.dmg only
          # on main and only when post-build verification passed, so the file's
          # existence is the gate. Reading it here rather than reconstructing a
          # path under /opt/mtx/build also survives upstream renaming its own DMG,
          # which it last did at release-99.0.
          SRC="release/MKVToolNix-${VERSION}-macos-arm.dmg"
          if [[ ! -f "${SRC}" ]]; then
            echo "::error::${SRC} not found — the build did not pass verification."
            exit 1
          fi
          DEST="release/MKVToolNix-${VERSION}-macos-apple-silicon.dmg"
          cp "${SRC}" "${DEST}"
          # Regenerate rather than copy: the .sha256 names the file it describes,
          # and the release notes tell people to run `shasum -c` against it.
          ( cd release && shasum -a 256 "${DEST##*/}" > "${DEST##*/}.sha256" )
          echo "Staged ${DEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: release/MKVToolNix-${{ env.VERSION }}-macos-apple-silicon.dmg

      - name: Determine CalVer tag
        id: calver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          # Find highest existing sequence number for this version+month
          # sed, not `grep -oP`: this job runs on macOS, whose BSD grep has no
          # -P and errors out, which silently left SEQ empty and every CI release
          # at sequence 1. Dots in the version are escaped so they match literally.
          # gh's output is kept and its status checked first: piped into sed,
          # a gh that fails yields no sequence numbers and the tag restarts at 1.
          VER_RE="${VERSION//./\\.}"
          LIST_ERR="${RUNNER_TEMP}/release-list.err"
          if ! RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 50 2>"${LIST_ERR}"); then
            echo "::error::gh release list failed, so the CalVer sequence is unknown: $(tail -n 1 "${LIST_ERR}")"
            exit 1
          fi
          SEQ=$(sed -nE "s/.*v${VER_RE}-b${YEAR}\.${MONTH}\.([0-9]+).*/\1/p" <<<"${RELEASES}" \
            | sort -rn | head -1)
          SEQ=$((${SEQ:-0} + 1))
          TAG_NAME="v${VERSION}-b${YEAR}.${MONTH}.${SEQ}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "CalVer tag: ${TAG_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          CALVER_TAG: ${{ steps.calver.outputs.tag_name }}
        run: |
          # Re-check immediately before publishing. check-release ran before a
          # build that can take up to three hours, and a release published by
          # hand during that window would otherwise get a duplicate alongside it.
          # A manual release always wins: this job exists to cover the case where
          # nobody got to it, not to race someone who did. gh's output is kept
          # and its status checked first: piped into grep, a gh that fails reads
          # as "no release" and the job publishes anyway.
          LIST_ERR="${RUNNER_TEMP}/release-list.err"
          if ! RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 50 2>"${LIST_ERR}"); then
            echo "::error::gh release list failed, so the re-check before publishing could not run: $(tail -n 1 "${LIST_ERR}")"
            exit 1
          fi
          if grep -q "v${VERSION}" <<<"${RELEASES}"; then
            # check-release does not look for a release on a forced run, so this one may predate the run.
            if [[ "${FORCE}" == "true" ]]; then
              echo "Not published: a release for v${VERSION} already exists; this run built, verified and attested only." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "A release for v${VERSION} was published while this build ran."
            echo "Leaving it alone — the manually published release stands."
            exit 0
          fi

          CALVER="${CALVER_TAG}"
          gh release create "${CALVER}" \
            --repo "${{ github.repository }}" \
            --title "MKVToolNix ${VERSION} — macOS (${CALVER})" \
            --notes "$(cat <<NOTES
          Unofficial macOS build of [MKVToolNix ${VERSION}](https://mkvtoolnix.download/).

          ## Download

          | Architecture | File |
          |-------------|------|
          | Apple Silicon (arm64) | \`MKVToolNix-${VERSION}-macos-apple-silicon.dmg\` |

          Not sure which? Apple menu > About This Mac. "Apple M_" = Apple Silicon, "Intel Core" = Intel.

          ## Before installing

          These DMGs are ad-hoc signed, not Apple-notarized. macOS will block first launch.
          **Read [Trust & install](https://github.com/${{ github.repository }}#trust--install) in the README before downloading** — it's short and explains the trust model and how to override Gatekeeper.

          ## Verify

          \`\`\`
          shasum -a 256 -c MKVToolNix-${VERSION}-macos-apple-silicon.dmg.sha256
          gh attestation verify MKVToolNix-${VERSION}-macos-apple-silicon.dmg --owner ${{ github.repository_owner }}
          \`\`\`

          The first checks integrity. The second cryptographically verifies this DMG was built by this repo's workflow from a specific commit.

          ## Build details

          - **Upstream:** MKVToolNix ${VERSION} (\`${TAG}\`)
          - **Target:** macOS 13+
          - **Automated build.** Built and published by CI without manual testing. Post-build verification (Qt version, architecture, duplicate dylibs, Homebrew library leak detection, app size) passed automatically. If you encounter issues, please [report them](https://github.com/${{ github.repository }}/issues).

          [Build patches](https://github.com/${{ github.repository }}/blob/main/PATCHES.md) |
          [Trust model](https://github.com/${{ github.repository }}/blob/main/docs/trust-model.md) |
          [Source](https://codeberg.org/mbunkus/mkvtoolnix/src/tag/${TAG})
          NOTES
          )" \
            "release/MKVToolNix-${VERSION}-macos-apple-silicon.dmg" \
            "release/MKVToolNix-${VERSION}-macos-apple-silicon.dmg.sha256"

      - name: Create issue on build failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          # The run's logs expire, so the issue carries the runner's toolchain and
          # the end of the build's own log, where a failed build records its error.
          if [[ -s "${RUNNER_TEMP}/toolchain.txt" ]]; then
            TOOLCHAIN=$(cat "${RUNNER_TEMP}/toolchain.txt")
          else
            TOOLCHAIN="Not recorded: the step that records it did not run."
          fi
          shopt -s nullglob
          logs=(logs/*.log)
          if (( ${#logs[@]} )); then
            BUILD_LOG=$(ls -t "${logs[@]}" | head -n 1)
            LOG_END=$(tail -n 25 "${BUILD_LOG}")
          else
            BUILD_LOG="none"
            LOG_END="No build log: the run stopped before the build started."
          fi
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Build failed: MKVToolNix ${VERSION} (${TAG})" \
            --label "build" \
            --body "$(cat <<BODY
          Automated build failed for MKVToolNix ${VERSION} from tag \`${TAG}\`.

          ${NOTE:+**Note:** ${NOTE}}

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **Runner:**
          ~~~
          ${TOOLCHAIN}
          ~~~

          **The end of the build log** (\`${BUILD_LOG}\`):
          ~~~
          ${LOG_END}
          ~~~
          BODY
          )"
